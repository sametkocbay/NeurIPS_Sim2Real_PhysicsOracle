[project]
name = "neurips-sim2real-physicsoracle"
version = "1.0.0"
description = "PhysicsOracle: NeurIPS 2026 RealPDE Track 1 (Simulation-to-Real) submission model"
# Mirrors the evaluation container: python 3.10, torch 2.2.2 + CUDA 12.1, numpy 1.26.
requires-python = "==3.10.*"
dependencies = [
    "torch==2.2.2",
    "numpy==1.26.4",
    "pyyaml",          # config files (training only)
    "h5py",            # tools/make_cache.py only (reads the raw competition data)
]

[project.optional-dependencies]
wandb = ["wandb"]      # optional live logging (python -m rpde.train ... --wandb)

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
